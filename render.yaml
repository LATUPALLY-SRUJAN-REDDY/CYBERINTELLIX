services:
  - type: web
    name: cyberintellix-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: CORS_ORIGINS
        value: https://cyberintellix.vercel.app,http://localhost:8000,http://127.0.0.1:8000
      - key: LLM_PROVIDER
        value: none
      - key: EMBEDDING_PROVIDER
        value: local
      - key: NVD_SYNC_START_DATE
        value: 2023-01-01
      - key: RUN_INITIAL_SYNC
        value: true
      - key: SCHEDULER_ENABLED
        value: true

